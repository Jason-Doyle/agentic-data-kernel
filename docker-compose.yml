services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    environment:
      POSTGRES_DB: agentic_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - agentic-postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d agentic_data
      interval: 2s
      timeout: 3s
      retries: 30

  bootstrap:
    image: ${AGENTIC_DATA_IMAGE:-agentic-data-kernel:local}
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/agentic_data
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      DATABASE_CA_CERT_BASE64: ${DATABASE_CA_CERT_BASE64:-}
    command:
      - node
      - dist/production/cli.js
      - bootstrap-role

  migrate:
    profiles:
      - server
    image: ${AGENTIC_DATA_IMAGE:-agentic-data-kernel:local}
    build:
      context: .
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/agentic_data
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      DATABASE_CA_CERT_BASE64: ${DATABASE_CA_CERT_BASE64:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-openai-compatible-v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
    command:
      - node
      - dist/production/cli.js
      - migrate

  artifact-init:
    profiles:
      - server
    image: alpine:3.22
    volumes:
      - ${ARTIFACT_DIR_HOST:-./.data/production-artifacts}:/artifacts
    command:
      - /bin/sh
      - -ec
      - mkdir -p /artifacts && chown -R 10001:10001 /artifacts && chmod 700 /artifacts

  app:
    profiles:
      - server
    image: ${AGENTIC_DATA_IMAGE:-agentic-data-kernel:local}
    build:
      context: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      artifact-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://agentic_app:${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}@postgres:5432/agentic_data
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      DATABASE_CA_CERT_BASE64: ${DATABASE_CA_CERT_BASE64:-}
      AUTH_PEPPER: ${AUTH_PEPPER:-}
      ARTIFACT_KEYRING: ${ARTIFACT_KEYRING:-}
      ARTIFACT_CURRENT_KEY_ID: ${ARTIFACT_CURRENT_KEY_ID:-v1}
      ARTIFACT_DIR: /var/lib/agentic-data/artifacts
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-openai-compatible-v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      SEARCH_CANDIDATE_LIMIT: ${SEARCH_CANDIDATE_LIMIT:-200}
      HNSW_EF_SEARCH: ${HNSW_EF_SEARCH:-100}
      HNSW_MAX_SCAN_TUPLES: ${HNSW_MAX_SCAN_TUPLES:-20000}
      EFFECT_ALLOWED_HOSTS: ${EFFECT_ALLOWED_HOSTS:-}
      HOST: 0.0.0.0
      PORT: 4318
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      MCP_HTTP_ENABLED: ${MCP_HTTP_ENABLED:-false}
      MCP_HTTP_PUBLIC_ORIGIN: ${MCP_HTTP_PUBLIC_ORIGIN:-}
      MCP_HTTP_WRITE_ENABLED: ${MCP_HTTP_WRITE_ENABLED:-false}
    expose:
      - "4318"
    volumes:
      - ${ARTIFACT_DIR_HOST:-./.data/production-artifacts}:/var/lib/agentic-data/artifacts
    command:
      - node
      - dist/production/cli.js
      - serve
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4318/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    profiles:
      - server
    image: ${AGENTIC_DATA_IMAGE:-agentic-data-kernel:local}
    build:
      context: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      artifact-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://agentic_app:${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}@postgres:5432/agentic_data
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      DATABASE_CA_CERT_BASE64: ${DATABASE_CA_CERT_BASE64:-}
      AUTH_PEPPER: ${AUTH_PEPPER:-}
      ARTIFACT_KEYRING: ${ARTIFACT_KEYRING:-}
      ARTIFACT_CURRENT_KEY_ID: ${ARTIFACT_CURRENT_KEY_ID:-v1}
      ARTIFACT_DIR: /var/lib/agentic-data/artifacts
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-openai-compatible-v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      SEARCH_CANDIDATE_LIMIT: ${SEARCH_CANDIDATE_LIMIT:-200}
      HNSW_EF_SEARCH: ${HNSW_EF_SEARCH:-100}
      HNSW_MAX_SCAN_TUPLES: ${HNSW_MAX_SCAN_TUPLES:-20000}
      EFFECT_ALLOWED_HOSTS: ${EFFECT_ALLOWED_HOSTS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_MONITOR_HOST: 0.0.0.0
      WORKER_MONITOR_PORT: 4319
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    expose:
      - "4319"
    volumes:
      - ${ARTIFACT_DIR_HOST:-./.data/production-artifacts}:/var/lib/agentic-data/artifacts
    command:
      - node
      - dist/production/cli.js
      - worker
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4319/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30

  proxy:
    profiles:
      - server
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - agentic-caddy-data:/data
      - agentic-caddy-config:/config

volumes:
  agentic-postgres:
  agentic-caddy-data:
  agentic-caddy-config:
