name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - if: matrix.node == 24
        run: npm run test:backup-manifest

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build production image
        run: docker build --tag agentic-data-kernel:test .
      - name: Check production CLI
        run: docker run --rm agentic-data-kernel:test node dist/production/cli.js --help

  deployments:
    name: Deployment templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Helm, Bicep, and OpenTofu
        shell: pwsh
        run: ./scripts/validate-deployments.ps1

  microsoft-integrations:
    name: Microsoft agent integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/microsoft-agent-framework/validation-requirements.txt
      - run: python -m pip install --disable-pip-version-check --quiet -r examples/microsoft-agent-framework/validation-requirements.txt
      - run: python scripts/validate-microsoft-integrations.py

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-administrator-password
      APP_DATABASE_PASSWORD: ci-application-password
      PRODUCTION_TEST_DATABASE_URL: postgresql://agentic_app:ci-application-password@127.0.0.1:54329/agentic_data
      PRODUCTION_TEST_MIGRATION_DATABASE_URL: postgresql://postgres:ci-administrator-password@127.0.0.1:54329/agentic_data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: docker compose up -d postgres
      - run: docker compose run --rm bootstrap
      - run: npm run build
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:ci-administrator-password@127.0.0.1:54329/agentic_data
          DATABASE_SSL: disable
        run: node dist/production/cli.js migrate
      - run: npm test
      - name: Run SRE comparison and verify published evidence
        env:
          BENCHMARK_REPETITIONS: 3
        run: npm run benchmark:sre:verify
      - name: Run backup and restore drill
        shell: pwsh
        run: ./scripts/test-backup-restore.ps1
      - name: Show container logs
        if: failure()
        run: docker compose logs postgres
      - name: Stop containers
        if: always()
        run: docker compose down -v
