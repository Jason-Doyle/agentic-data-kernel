name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/jason-doyle/agentic-data-kernel

jobs:
  package:
    name: Validate release package
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: release-administrator-password
      APP_DATABASE_PASSWORD: release-application-password
      PRODUCTION_TEST_DATABASE_URL: postgresql://agentic_app:release-application-password@127.0.0.1:54329/agentic_data
      PRODUCTION_TEST_MIGRATION_DATABASE_URL: postgresql://postgres:release-administrator-password@127.0.0.1:54329/agentic_data
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/microsoft-agent-framework/validation-requirements.txt
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Use supported npm
        run: npm install --global npm@12.0.2
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check --quiet -r examples/microsoft-agent-framework/validation-requirements.txt
      - run: python scripts/validate-microsoft-integrations.py
      - name: Validate release tag
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
      - run: docker compose up -d postgres
      - run: docker compose run --rm bootstrap
      - run: npm run build
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:release-administrator-password@127.0.0.1:54329/agentic_data
          DATABASE_SSL: disable
        run: node dist/production/cli.js migrate
      - run: npm run release:check
      - run: npm run deployment:check
      - name: Verify SRE evidence
        env:
          BENCHMARK_REPETITIONS: 3
        run: npm run benchmark:sre:verify
      - name: Run backup and restore drill
        shell: pwsh
        run: ./scripts/test-backup-restore.ps1
      - name: Smoke supported container architectures
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag agentic-data-kernel:release-amd64 \
            .
          docker run --rm agentic-data-kernel:release-amd64 \
            node dist/production/cli.js --help
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag agentic-data-kernel:release-arm64 \
            .
          docker run --rm agentic-data-kernel:release-arm64 \
            node dist/production/cli.js --help
      - name: Create npm artifact
        run: |
          mkdir release-artifacts
          npm pack --json --pack-destination release-artifacts
          npm sbom --sbom-format spdx > release-artifacts/npm-sbom.spdx.json
          cd release-artifacts
          sha256sum *.tgz *.json > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Stop containers
        if: always()
        run: docker compose down -v

  npm:
    name: Publish npm package
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release-artifacts
      - name: Publish package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "agentic-data-kernel@$VERSION" version --json >/dev/null 2>&1; then
            echo "agentic-data-kernel@$VERSION is already published"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          npm publish ./release-artifacts/*.tgz \
            --access public \
            --provenance \
            --tag "$DIST_TAG"

  container:
    name: Publish production container
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=next,enable=${{ contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Agentic Data Kernel
            org.opencontainers.image.description=Temporal knowledge and durable workflow infrastructure for software agents
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  github:
    name: Create GitHub release
    needs:
      - npm
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release-artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_ARGS=(
            release create "$GITHUB_REF_NAME"
            release-artifacts/*.tgz
            release-artifacts/*.json
            release-artifacts/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "Agentic Data Kernel $VERSION"
          )
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          else
            RELEASE_ARGS+=(--latest)
          fi
          gh "${RELEASE_ARGS[@]}"
